[project]
name = "agent-lab"
version = "0.1.0"
description = "도구, 에이전트, 워크플로를 조합해 LLM 에이전트 설계를 실험하는 저장소"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.0",
    "httpx>=0.28.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agent = "cli:main"
researcher = "cli:researcher"
coder = "cli:coder"
optimizer = "cli:optimizer"
evaluator = "cli:evaluator"
planner = "cli:planner"
reviewer = "cli:reviewer"
debugger = "cli:debugger"
kernel-opt-oneshot = "cli:kernel_opt_oneshot"
kernel-opt-orchestrator = "cli:kernel_opt_orchestrator"
kernelbench = "cli:kernelbench"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["cli.py", "llm.py", "tracing.py", "agents", "tools", "workflows", "benchmarks"]
